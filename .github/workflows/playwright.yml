name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Dependencies
      run: npm install

    # Khởi tạo thư mục user_data & Copy state.json linh hoạt theo môi trường Runner (macOS, Windows, Linux)
    - name: Ensure user_data and Copy State
      run: |
        node -e "
          const fs = require('fs');
          const path = require('path');
          const os = require('os');

          const target = path.join(process.cwd(), 'user_data', 'state.json');
          if (fs.existsSync(target)) {
            console.log('state.json already exists in workspace:', target);
            process.exit(0);
          }

          const candidates = [
            path.join(os.homedir(), 'Desktop', 'Work', 'Moonstake', 'Moonstake', 'user_data', 'state.json'),
            path.join(os.homedir(), 'Desktop', 'Work', 'Moonstake', 'user_data', 'state.json'),
            path.join(os.homedir(), 'Work', 'Moonstake', 'Moonstake', 'user_data', 'state.json'),
            path.join(os.homedir(), 'Work', 'Moonstake', 'user_data', 'state.json'),
            'E:\\\\Work\\\\Moonstake\\\\user_data\\\\state.json',
            'D:\\\\Work\\\\Moonstake\\\\user_data\\\\state.json'
          ];

          let found = false;
          for (const p of candidates) {
            if (fs.existsSync(p)) {
              console.log('Successfully found and copied state.json from:', p);
              fs.mkdirSync(path.dirname(target), { recursive: true });
              fs.copyFileSync(p, target);
              found = true;
              break;
            }
          }

          if (!found) {
            console.error('CRITICAL: state.json was not found in any local candidate path!');
            process.exit(1);
          }
        "

    - name: Run Playwright Tests
      run: npx playwright test tests/balance-onchain.spec.ts
      env:
        CI: true
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}

    - name: Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 14