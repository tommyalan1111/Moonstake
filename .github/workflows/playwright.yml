name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash # Bỏ qua rào cản ExecutionPolicy của PowerShell trên Windows

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Dependencies
      run: npm ci

    - name: Run Playwright Tests
      run: npx playwright test tests/asset.spec.ts