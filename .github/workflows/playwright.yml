name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Dependencies
      shell: cmd
      run: npm install

    # Khởi tạo thư mục user_data & Copy state.json linh hoạt theo môi trường Runner
    - name: Ensure user_data and Copy State
      shell: powershell
      run: |
        # 1. Tạo thư mục user_data trong thư mục làm việc của Runner
        if (-not (Test-Path -Path "user_data")) {
            New-Item -ItemType Directory -Path "user_data" -Force
        }

        # 2. Danh sách các đường dẫn chứa state.json local
        $possiblePaths = @(
            "E:\Work\Moonstake\user_data\state.json",
            "D:\Work\Moonstake\user_data\state.json",
            "$HOME\Work\Moonstake\user_data\state.json"
        )

        $found = $false
        foreach ($path in $possiblePaths) {
            Write-Host "Checking path: $path"
            if (Test-Path -Path $path) {
                Copy-Item -Path $path -Destination "user_data\state.json" -Force
                Write-Host "Successfully copied state.json from $path"
                $found = $true
                break
            }
        }

        if (-not $found) {
            Write-Error "CRITICAL: state.json was not found in any local path! Please place state.json at E:\Work\Moonstake\user_data\state.json"
            exit 1
        }

    - name: Run Playwright Tests
      shell: cmd
      run: npx playwright test tests/asset.spec.ts

      