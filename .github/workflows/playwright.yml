name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Cho phép bấm chạy thủ công trên GitHub UI

jobs:
  test:
    # Chạy trên Self-Hosted Runner vừa cài đặt
    runs-on: self-hosted

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Dependencies
      run: npm ci

    - name: Run Playwright Tests
      run: npx playwright test tests/asset.spec.ts