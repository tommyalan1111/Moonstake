name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Dependencies
      shell: cmd
      run: npm install

    # Khởi tạo thư mục user_data & Copy state.json linh hoạt theo môi trường Runner
    - name: Ensure user_data and Copy State
      shell: powershell
      run: |
        # 1. Tạo thư mục user_data nếu chưa có
        if (-not (Test-Path -Path "user_data")) {
            New-Item -ItemType Directory -Path "user_data" -Force
        }

        # 2. Tìm file state.json từ thư mục project local trên máy (tìm ở các ổ đĩa/thư mục tương đương)
        $possiblePaths = @(
            "E:\Work\Moonstake\user_data\state.json",
            "D:\Work\Moonstake\user_data\state.json",
            "$HOME/Work/Moonstake/user_data/state.json"
        )

        $found = $false
        foreach ($path in $possiblePaths) {
            if (Test-Path -Path $path) {
                Copy-Item -Path $path -Destination "user_data\state.json" -Force
                Write-Host "Successfully copied state.json from $path"
                $found = $true
                break
            }
        }

        if (-not $found) {
            Write-Warning "Could not find local state.json in predefined paths. Test might run unauthenticated."
        }

    - name: Run Playwright Tests
      shell: cmd
      run: npx playwright test tests/asset.spec.ts